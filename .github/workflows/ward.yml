# Ward checks itself with its own entry point, on Linux and on Windows, plus the
# fixture suite. The auto-merge job calls a released commit, never ./: a pull
# request could otherwise change the code that runs with write access before
# I review it. Dependabot proposes the bump to each new release, and the job
# refuses to merge that bump itself.
name: Ward

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ward:
    uses: ./.github/workflows/ci.yml
    with:
      node: .
      dotnet: fixtures/dotnet-ok

  ward-windows:
    uses: ./.github/workflows/ci.yml
    with:
      dotnet: fixtures/dotnet-ok
      dotnet-os: windows-latest

  # The EF path comes from the repository root and the fixture pins its own
  # dotnet-ef in a tool manifest, next to the one ci.yml installs globally.
  ward-ef:
    uses: ./.github/workflows/ci.yml
    with:
      dotnet: fixtures/dotnet-ef
      dotnet-ef-project: fixtures/dotnet-ef/src/Fixture.Data

  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm run test:fixtures

  hygiene:
    uses: ./.github/workflows/repo-hygiene.yml
    with:
      mode: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'warn' || 'strict' }}

  automerge:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: malinfossum/ward/.github/workflows/dependabot-automerge.yml@81c5a32c5a0bdb52ea1f8e99fd314d41eb73b397 # v1.2.1
